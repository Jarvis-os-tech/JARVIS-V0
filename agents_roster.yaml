# ==============================================================================
# J.A.R.V.I.S. OS — Autonomous Agent Workforce Roster
# ==============================================================================
# Version: 1.0.0
# Description: Defines the executive hierarchy and operational workforce.
# J.A.R.V.I.S. operates as the Executive CEO, with Hermes currently active as the
# primary engineering worker. Additional agents are registered incrementally.
# ==============================================================================

organization:
  name: "J.A.R.V.I.S. Autonomous Operations"
  headquarters: "Stark Tower OS"
  version: "1.0.0"

agents:
  jarvis:
    id: "jarvis"
    name: "J.A.R.V.I.S."
    title: "Chief Executive Officer (CEO) & Master Orchestrator"
    status: "ACTIVE_CEO"
    primary: true
    description: "Autonomous strategic leader who interprets user directives, prescribes multi-step workflows, delegates tasks to specialist agents, enforces code quality gates, and reports back with British executive precision."
    capabilities:
      - "mission_decomposition"
      - "workflow_prescription"
      - "subagent_delegation"
      - "quality_gate_enforcement"
      - "central_memory_indexing"
      - "executive_voice_reporting"
    skills:
      - "using-ceo"
      - "speckit-plan"
      - "speckit-tasks"
      - "speckit-specify"
      - "code-quality-check"
      - "verification-before-completion"

  hermes:
    id: "hermes"
    name: "Hermes Agent"
    title: "Chief Technology Officer (CTO) & Lead Software Engineer"
    status: "ACTIVE_WORKER"
    primary: true
    description: "Deep engineering actuator with terminal and filesystem access, responsible for full-stack code implementation, automated testing, bug remediation, and architecture execution."
    capabilities:
      - "deep_reasoning"
      - "code_implementation"
      - "code_refactoring"
      - "unit_testing"
      - "cli_execution"
      - "actuator_tools"
      - "multi_turn_session"
      - "openshell_governed"
    bridge:
      type: "cli"
      script: "backend/hermes_bridge.ts"
      binary: "/home/g0pi/.local/bin/hermes"
      timeout_seconds: 180
    skills:
      - "systematic-debugging"
      - "test-driven-development"
      - "subagent-driven-development"
      - "finishing-a-development-branch"

  agy:
    id: "agy"
    name: "AGY (Gemini)"
    title: "Principal Architecture & Antigravity Systems Engineer"
    status: "ACTIVE_WORKER"
    primary: true
    description: "Google Antigravity CLI powered by Gemini for codebase understanding, code generation, refactoring, and deep reasoning under OpenShell governance."
    capabilities:
      - "antigravity_architect"
      - "gemini_deep_reasoning"
      - "cli_execution"
      - "openshell_governed"
    bridge:
      type: "cli"
      binary: "/home/g0pi/.local/bin/agy"
      timeout_seconds: 180
    skills:
      - "speckit-plan"
      - "speckit-tasks"

  omh:
    id: "omh"
    name: "OMH (Omarchy)"
    title: "Omarchy Quattro Workflow Specialist"
    status: "ACTIVE_WORKER"
    primary: true
    description: "Omarchy Quattro CLI agent for multi-skill workflow coordination, system diagnostics, and workstation automation under OpenShell governance."
    capabilities:
      - "workflow_orchestration"
      - "hardware_diagnostics"
      - "cli_execution"
      - "openshell_governed"
    bridge:
      type: "cli"
      binary: "/home/g0pi/.local/bin/omh"
      timeout_seconds: 180
    skills: []

  opencode:
    id: "opencode"
    name: "OMH (OpenCode)"
    title: "Full-Stack System Engineer"
    status: "ACTIVE_WORKER"
    primary: true
    description: "Autonomous full-stack engineering agent with multi-turn session tracking and ACP/MCP toolset interoperability under OpenShell governance."
    capabilities:
      - "system_integration"
      - "acp_connectivity"
      - "code_implementation"
      - "openshell_governed"
    bridge:
      type: "cli"
      binary: "/home/g0pi/.local/bin/opencode"
      timeout_seconds: 180
    skills: []

  codex:
    id: "codex"
    name: "Codex (CloudCode)"
    title: "Senior Implementation Specialist"
    status: "ACTIVE_WORKER"
    primary: true
    description: "Codex CLI / CloudCode specialized in rapid automated feature implementation, test creation, and code generation under OpenShell governance."
    capabilities:
      - "feature_codegen"
      - "automated_review"
      - "cli_execution"
      - "openshell_governed"
    bridge:
      type: "cli"
      binary: "/home/g0pi/.local/bin/codex"
      timeout_seconds: 180
    skills: []

  openclaw:
    id: "openclaw"
    name: "OpenClaw"
    title: "Autonomous Multi-Channel & Desktop Actuator"
    status: "ACTIVE_WORKER"
    primary: true
    description: "System diagnostics, channel messaging, and OS desktop automation under OpenShell governance."
    capabilities:
      - "multi_channel_action"
      - "desktop_actuation"
      - "system_monitoring"
      - "openshell_governed"
    bridge:
      type: "cli"
      binary: "/usr/bin/openclaw"
      timeout_seconds: 180
    skills: []
