<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S. — Central Brain Command Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
              display: ['"Orbitron"', 'sans-serif'],
            },
            colors: {
              cyber: {
                bg: '#05070d',
                surface: '#0a0f1d',
                card: '#0c1326',
                cardHover: '#101a35',
                border: '#162342',
                borderLight: '#1f325d',
                cyan: '#00f0ff',
                cyanGlow: '#00c8d6',
                emerald: '#10b981',
                amber: '#f59e0b',
                red: '#ef4444',
                purple: '#8b5cf6',
                blue: '#3b82f6',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #05070d;
        color: #f1f5f9;
        font-family: 'Inter', system-ui, sans-serif;
        background-image: 
          radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.035) 0%, transparent 40%),
          radial-gradient(circle at 85% 20%, rgba(139, 92, 246, 0.03) 0%, transparent 40%),
          radial-gradient(circle at 50% 80%, rgba(16, 185, 129, 0.025) 0%, transparent 50%);
        background-attachment: fixed;
      }
      
      /* Sleek Cyber Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #05070d;
      }
      ::-webkit-scrollbar-thumb {
        background: #1f325d;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f0ff;
      }

      .cyber-glow {
        box-shadow: 0 0 25px -5px rgba(0, 240, 255, 0.12);
      }
      .cyber-glow-emerald {
        box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.15);
      }
      .cyber-glow-amber {
        box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.15);
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#05070d] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
