<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="60%" stop-color="#040c1a" />
      <stop offset="100%" stop-color="#02050d" />
    </radialGradient>

    <!-- Cyan Energy Gradient -->
    <linearGradient id="cyanEnergy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Core Plasma Glow -->
    <radialGradient id="corePlasma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#a5f3fc" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="90%" stop-color="#0891b2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />

  <!-- Subtle Outer HUD Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.4" />

  <!-- Outer Arc Segments (Stark Arc Reactor style) -->
  <g stroke="url(#cyanEnergy)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)">
    <!-- 4 Major Primary Segments -->
    <path d="M 126 126 A 184 184 0 0 1 216 78" />
    <path d="M 296 78 A 184 184 0 0 1 386 126" />
    <path d="M 386 386 A 184 184 0 0 1 296 434" />
    <path d="M 216 434 A 184 184 0 0 1 126 386" />
  </g>

  <!-- Ticks on Reactor Perimeter -->
  <g stroke="#22d3ee" stroke-width="2" stroke-opacity="0.6">
    <line x1="256" y1="46" x2="256" y2="60" />
    <line x1="256" y1="452" x2="256" y2="466" />
    <line x1="46" y1="256" x2="60" y2="256" />
    <line x1="452" y1="256" x2="466" y2="256" />
    <!-- Diagonals -->
    <line x1="108" y1="108" x2="118" y2="118" />
    <line x1="404" y1="108" x2="394" y2="118" />
    <line x1="108" y1="404" x2="118" y2="394" />
    <line x1="404" y1="404" x2="394" y2="394" />
  </g>

  <!-- Mid Armor Housing Ring -->
  <circle cx="256" cy="256" r="148" fill="#030b17" stroke="#0e7490" stroke-width="4" stroke-opacity="0.7" />
  <circle cx="256" cy="256" r="138" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.5" />

  <!-- 10 Reactor Toroid Coils (Magnetic Field Generators) -->
  <g fill="#0e7490" stroke="#38bdf8" stroke-width="1.5">
    <!-- 0 deg -->
    <rect x="248" y="112" width="16" height="22" rx="3" fill="#083344" />
    <!-- 36 deg -->
    <rect x="330" y="140" width="16" height="22" rx="3" fill="#083344" transform="rotate(36 338 151)" />
    <!-- 72 deg -->
    <rect x="375" y="210" width="16" height="22" rx="3" fill="#083344" transform="rotate(72 383 221)" />
    <!-- 108 deg -->
    <rect x="360" y="295" width="16" height="22" rx="3" fill="#083344" transform="rotate(108 368 306)" />
    <!-- 144 deg -->
    <rect x="298" y="360" width="16" height="22" rx="3" fill="#083344" transform="rotate(144 306 371)" />
    <!-- 180 deg -->
    <rect x="248" y="378" width="16" height="22" rx="3" fill="#083344" transform="rotate(180 256 389)" />
    <!-- 216 deg -->
    <rect x="182" y="358" width="16" height="22" rx="3" fill="#083344" transform="rotate(216 190 369)" />
    <!-- 252 deg -->
    <rect x="136" y="295" width="16" height="22" rx="3" fill="#083344" transform="rotate(252 144 306)" />
    <!-- 288 deg -->
    <rect x="121" y="210" width="16" height="22" rx="3" fill="#083344" transform="rotate(288 129 221)" />
    <!-- 324 deg -->
    <rect x="166" y="140" width="16" height="22" rx="3" fill="#083344" transform="rotate(324 174 151)" />
  </g>

  <!-- Glowing Plasma Core Field -->
  <circle cx="256" cy="256" r="102" fill="url(#corePlasma)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="88" fill="none" stroke="#67e8f9" stroke-width="3" stroke-opacity="0.9" />

  <!-- Inner Core Reactor Aperture (Triangle / Hex Mesh) -->
  <polygon points="256,182 320,293 192,293" fill="none" stroke="#ecfeff" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)" />
  <polygon points="256,330 192,219 320,219" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.7" stroke-linejoin="round" />

  <!-- Center Singularity Pulse -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="256" r="14" fill="#a5f3fc" />

  <!-- Subtitle Typography for J.A.R.V.I.S. inside badge -->
  <text x="256" y="475" text-anchor="middle" font-family="monospace, sans-serif" font-weight="900" font-size="28" fill="#38bdf8" letter-spacing="8">J.A.R.V.I.S.</text>
</svg>
