<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for Full Bleed Maskable Area -->
    <radialGradient id="maskBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="60%" stop-color="#040c1a" />
      <stop offset="100%" stop-color="#02050d" />
    </radialGradient>

    <linearGradient id="maskCyanEnergy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <radialGradient id="maskCorePlasma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#a5f3fc" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="90%" stop-color="#0891b2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>

    <filter id="maskGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full Bleed Square Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#maskBgGlow)" />

  <!-- Scaled group centered inside safe zone (approx 78% size) -->
  <g transform="translate(56, 56) scale(0.78)">
    <!-- Outer Rings -->
    <circle cx="256" cy="256" r="236" fill="none" stroke="#0891b2" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 6" />
    <circle cx="256" cy="256" r="218" fill="none" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.5" />

    <!-- Outer Arc Segments -->
    <g stroke="url(#maskCyanEnergy)" stroke-width="7" fill="none" stroke-linecap="round" filter="url(#maskGlow)">
      <path d="M 126 126 A 184 184 0 0 1 216 78" />
      <path d="M 296 78 A 184 184 0 0 1 386 126" />
      <path d="M 386 386 A 184 184 0 0 1 296 434" />
      <path d="M 216 434 A 184 184 0 0 1 126 386" />
    </g>

    <!-- Ticks -->
    <g stroke="#22d3ee" stroke-width="2" stroke-opacity="0.7">
      <line x1="256" y1="46" x2="256" y2="62" />
      <line x1="256" y1="450" x2="256" y2="466" />
      <line x1="46" y1="256" x2="62" y2="256" />
      <line x1="450" y1="256" x2="466" y2="256" />
    </g>

    <!-- Mid Armor Housing Ring -->
    <circle cx="256" cy="256" r="148" fill="#030b17" stroke="#0e7490" stroke-width="4" stroke-opacity="0.8" />
    <circle cx="256" cy="256" r="138" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.6" />

    <!-- 10 Coils -->
    <g fill="#0e7490" stroke="#38bdf8" stroke-width="1.5">
      <rect x="248" y="112" width="16" height="22" rx="3" fill="#083344" />
      <rect x="330" y="140" width="16" height="22" rx="3" fill="#083344" transform="rotate(36 338 151)" />
      <rect x="375" y="210" width="16" height="22" rx="3" fill="#083344" transform="rotate(72 383 221)" />
      <rect x="360" y="295" width="16" height="22" rx="3" fill="#083344" transform="rotate(108 368 306)" />
      <rect x="298" y="360" width="16" height="22" rx="3" fill="#083344" transform="rotate(144 306 371)" />
      <rect x="248" y="378" width="16" height="22" rx="3" fill="#083344" transform="rotate(180 256 389)" />
      <rect x="182" y="358" width="16" height="22" rx="3" fill="#083344" transform="rotate(216 190 369)" />
      <rect x="136" y="295" width="16" height="22" rx="3" fill="#083344" transform="rotate(252 144 306)" />
      <rect x="121" y="210" width="16" height="22" rx="3" fill="#083344" transform="rotate(288 129 221)" />
      <rect x="166" y="140" width="16" height="22" rx="3" fill="#083344" transform="rotate(324 174 151)" />
    </g>

    <!-- Glowing Core -->
    <circle cx="256" cy="256" r="102" fill="url(#maskCorePlasma)" filter="url(#maskGlow)" />
    <circle cx="256" cy="256" r="88" fill="none" stroke="#67e8f9" stroke-width="3" stroke-opacity="0.9" />

    <!-- Hex/Triangle Mesh -->
    <polygon points="256,182 320,293 192,293" fill="none" stroke="#ecfeff" stroke-width="5" stroke-linejoin="round" filter="url(#maskGlow)" />
    <polygon points="256,330 192,219 320,219" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.8" stroke-linejoin="round" />

    <!-- Center Singularity Pulse -->
    <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#maskGlow)" />
    <circle cx="256" cy="256" r="14" fill="#a5f3fc" />

    <text x="256" y="475" text-anchor="middle" font-family="monospace, sans-serif" font-weight="900" font-size="28" fill="#38bdf8" letter-spacing="8">J.A.R.V.I.S.</text>
  </g>
</svg>
